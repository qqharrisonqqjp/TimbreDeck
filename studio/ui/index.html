<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TimbreDeck 聲台</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="/mark.svg" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <header>
      <div class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true">▮▥</span>TimbreDeck
          <small>聲台</small>
        </div>
        <nav id="switcher" aria-label="引擎切換"></nav>
        <select id="compact" aria-label="切換引擎"></select>
      </div>
    </header>
    <main>
      <div class="headline">
        <div>
          <h1 id="title"></h1>
          <p id="subtitle"></p>
        </div>
        <span id="state" class="state"></span>
      </div>
      <nav id="tabs" aria-label="工作模式"></nav>
      <div id="job" role="status"></div>
      <div id="notice" role="status"></div>
      <section id="work"></section>
      <p id="saved" role="status"></p>
    </main>
  </body>
</html>
