name: Windows portable preview
on:
  push:
    branches: [main]
    paths: ['studio/**', 'cmd/**', 'go.mod', 'tests/**', 'tools/**', 'docs/**', 'Open-TimbreDeck.cmd', '.github/workflows/windows-preview.yml']
  pull_request:
    paths: ['studio/**', 'cmd/**', 'go.mod', 'tests/**', 'tools/**', 'docs/**', 'Open-TimbreDeck.cmd', '.github/workflows/windows-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test ./...
      - shell: pwsh
        run: ./tools/build_windows_release.ps1 -OutputRoot portable-release
      - shell: pwsh
        run: ./tests/portable_release.ps1 -ReleaseRoot (Resolve-Path portable-release).Path -TestData "${{ runner.temp }}/TimbreDeckLauncherQA"
      - run: python tests/smoke.py portable-release/TimbreDeck/Start.exe
      - run: python tests/lifecycle.py portable-release/TimbreDeck/Start.exe
      - run: python tests/training_tools.py
      - run: python -m unittest discover -s tests -p "test_td_*.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.61.1
      - run: npx playwright install chromium
      - run: node tests/workstation_browser.cjs
      - run: node tests/training_settings_browser.cjs
      - shell: pwsh
        run: node tests/studio_exit_browser.cjs modified portable-release/TimbreDeck/Start.exe "$env:RUNNER_TEMP/TimbreDeckExitQA"
      - id: version
        shell: pwsh
        run: |
          $version = (Get-Content studio/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+-preview\.\d+$') { throw "Invalid preview version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          $changed = git diff HEAD^ HEAD --name-only -- studio/VERSION
          if ($changed -or $env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { "publish=true" >> $env:GITHUB_OUTPUT }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: |
            portable-release/TimbreDeck-Windows-x64.zip
            portable-release/SHA256SUMS.txt
  preview-release:
    needs: verify
    if: github.ref == 'refs/heads/main' && needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-preview
      - name: Publish verified launcher
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "v$VERSION" TimbreDeck-Windows-x64.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "TimbreDeck 聲台 v$VERSION" \
            --notes "Windows x64 聲台預覽版。解壓後雙擊 Open-TimbreDeck.cmd。只附 2B 示範參考音，不含其他錄音、歷史、引擎或模型權重；可於設定查看版本及建置編號。"
